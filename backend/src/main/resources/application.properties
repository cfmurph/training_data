server.port=3001

# Session — 2h idle timeout, cookie flags
spring.session.store-type=none
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
# SameSite=Strict would break Strava/Garmin/TrainingPeaks OAuth login: the
# provider redirects the browser back to our /callback endpoint as a
# cross-site top-level GET navigation, and Strict cookies are never sent on
# cross-site requests (even top-level GET), so the session (and the
# oauthState we verify against) would never reach the callback. Lax still
# blocks the cookie on cross-site POSTs/subresource requests (real CSRF
# protection) while allowing it on top-level GET redirects like OAuth
# callbacks.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Strava OAuth
strava.client-id=${STRAVA_CLIENT_ID:}
strava.client-secret=${STRAVA_CLIENT_SECRET:}
strava.redirect-uri=${STRAVA_REDIRECT_URI:http://localhost:3001/api/auth/strava/callback}

# Garmin OAuth 1.0a
garmin.consumer-key=${GARMIN_CONSUMER_KEY:}
garmin.consumer-secret=${GARMIN_CONSUMER_SECRET:}
garmin.redirect-uri=${GARMIN_REDIRECT_URI:http://localhost:3001/api/auth/garmin/callback}

# Training Peaks OAuth 2.0 (optional — requires partnership approval)
trainingpeaks.client-id=${TRAININGPEAKS_CLIENT_ID:}
trainingpeaks.client-secret=${TRAININGPEAKS_CLIENT_SECRET:}
trainingpeaks.redirect-uri=${TRAININGPEAKS_REDIRECT_URI:http://localhost:3001/api/auth/trainingpeaks/callback}

# Frontend
frontend.url=${FRONTEND_URL:http://localhost:5173}

# H2 persistent database for training plans and weight entries
spring.datasource.url=jdbc:h2:file:./data/traintrack;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Jackson — serialize LocalDate as ISO strings
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging — INFO by default; override per-profile
logging.level.com.traintrack=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
