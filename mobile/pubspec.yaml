name: traintrack_mobile
description: TrainTrack — Cycling training plan, performance tracking, and weight loss for Android.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client with cookie/session support
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # WebView for OAuth flows
  webview_flutter: ^4.10.0

  # Charts
  fl_chart: ^0.70.2

  # Calendar
  table_calendar: ^3.1.2

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  provider: ^6.1.2
  url_launcher: ^6.3.0

  # Icons + UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
